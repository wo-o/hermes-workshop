[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fastcampus-hermes-extension-lab"
version = "0.1.0"
description = "A tiny stdio MCP server for Hermes extension training"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Techwoo" }]
dependencies = ["mcp>=1.9,<2"]

[project.scripts]
fastcampus-hermes-lab-mcp = "fastcampus_hermes_lab.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fastcampus_hermes_lab"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = ["--confcutdir=tests"]
testpaths = ["tests"]
