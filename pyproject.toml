[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-workshop-mcp"
version = "0.2.0"
description = "Hermes 확장 교육용 초소형 stdio MCP 서버"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Techwoo" }]
dependencies = ["mcp>=1.9,<2"]

[project.scripts]
hermes-workshop-mcp = "hermes_workshop_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_workshop_mcp"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = ["--confcutdir=tests"]
testpaths = ["tests"]
